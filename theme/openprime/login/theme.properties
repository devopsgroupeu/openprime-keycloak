parent=keycloak
import=common/keycloak

# OpenPrime Theme — shadcn/ui inspired
# Override stylesCommon to prevent PatternFly CSS from loading
stylesCommon=
styles=css/theme.css
locales=en

# Theme metadata
name=OpenPrime
displayName=OpenPrime
version=2.0.0

# Override Keycloak class mappings to prevent PF grid classes
kcHtmlClass=login-pf
kcContainerClass=kc-container
kcContainerWrapperClass=kc-container-wrapper
kcHeaderClass=kc-header
kcHeaderWrapperClass=kc-header-wrapper
kcContentClass=kc-content
kcContentWrapperClass=kc-content-wrapper
kcSignUpClass=kc-signup
kcInfoAreaWrapperClass=kc-info-wrapper
kcFormGroupClass=form-group