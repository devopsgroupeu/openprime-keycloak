{{- if .Values.realmSetup.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "openprime-keycloak.fullname" . }}-realm-setup
  labels:
    {{- include "openprime-keycloak.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "1"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  template:
    metadata:
      annotations:
        {{- if .Values.app.existingSecret }}
        checksum/secrets: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum | default "dynamic" }}
        {{- end }}
      labels:
        {{- include "openprime-keycloak.realmSetupSelectorLabels" . | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ include "openprime-keycloak.fullname" . }}-realm-setup
      securityContext:
        {{- toYaml .Values.realmSetup.podSecurityContext | nindent 8 }}
      # config-cli imports the realm; the SMTP step then proves mail works and
      # only afterwards switches on the flows that depend on it. initContainer
      # rather than a second container because containers run in parallel and
      # this ordering is the whole point.
      initContainers:
        - name: keycloak-config-cli
          image: "{{ .Values.realmSetup.image.repository }}:{{ .Values.realmSetup.image.tag }}"
          imagePullPolicy: {{ .Values.realmSetup.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.realmSetup.securityContext | nindent 12 }}
          env:
            - name: KEYCLOAK_URL
              value: "http://{{ include "openprime-keycloak.fullname" . }}:{{ .Values.service.port }}"
            {{- include "openprime-keycloak.realmSetupAdminEnv" . | nindent 12 }}
            - name: KEYCLOAK_AVAILABILITYCHECK_ENABLED
              value: "true"
            - name: KEYCLOAK_AVAILABILITYCHECK_TIMEOUT
              value: "120s"
            - name: IMPORT_PATH
              value: "/config"
            - name: IMPORT_FORCE
              value: "true"
            # No variable substitution: the realm JSON carries no secrets any
            # more. A placeholder that a third-party tool must recognise fails
            # silently when it does not — the realm then holds the literal
            # string as its SMTP password and everything still reports success.
            - name: IMPORT_VARSUBSTITUTION_ENABLED
              value: "false"
          volumeMounts:
            - name: realm-config
              mountPath: /config
              readOnly: true
          resources:
            {{- toYaml .Values.realmSetup.resources | nindent 12 }}
      containers:
        # SMTP and identity providers: the realm settings that need a secret or
        # a check, which is why they are not in the imported realm JSON.
        - name: realm-setup
          # The Keycloak image already carries kcadm.sh and a JRE, so this needs
          # no extra image and installs nothing at run time.
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.realmSetup.securityContext | nindent 12 }}
          env:
            - name: KEYCLOAK_URL
              value: "http://{{ include "openprime-keycloak.fullname" . }}:{{ .Values.service.port }}"
            - name: REALM
              value: {{ .Values.openprime.realm.name | default "openprime" | quote }}
            - name: KEYCLOAK_WAIT_SECONDS
              value: {{ .Values.realmSetup.keycloakWaitSeconds | default 180 | quote }}
            {{- include "openprime-keycloak.realmSetupAdminEnv" . | nindent 12 }}
{{- with .Values.openprime.realm.identityProviders.google }}
{{- if .enabled }}
{{- if not .clientId }}{{ fail "openprime.realm.identityProviders.google.enabled is true but clientId is empty" }}{{ end }}
{{- if not .clientSecretKey }}{{ fail "openprime.realm.identityProviders.google.enabled is true but clientSecretKey is empty — the client secret comes from the Secret under that key" }}{{ end }}
            - name: GOOGLE_ENABLED
              value: "true"
            - name: GOOGLE_CLIENT_ID
              value: {{ .clientId | quote }}
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  {{- if $.Values.app.existingSecret }}
                  name: {{ $.Values.app.existingSecret }}
                  {{- else }}
                  name: {{ include "openprime-keycloak.fullname" $ }}-secrets
                  {{- end }}
                  key: {{ .clientSecretKey }}
{{- else }}
            - name: GOOGLE_ENABLED
              value: "false"
{{- end }}
{{- end }}
{{- with .Values.openprime.realm.smtp }}
{{- if .enabled }}
{{- if not .host }}{{ fail "openprime.realm.smtp.enabled is true but smtp.host is empty — that would advertise password reset with nowhere to send it" }}{{ end }}
{{- if not .from }}{{ fail "openprime.realm.smtp.enabled is true but smtp.from is empty — Keycloak cannot send without a sender address" }}{{ end }}
{{- if and .auth (not .user) }}{{ fail "openprime.realm.smtp.auth is true but smtp.user is empty" }}{{ end }}
{{- if and .ssl .starttls }}{{ fail "openprime.realm.smtp: ssl and starttls are mutually exclusive — use ssl for 465, starttls for 587" }}{{ end }}
            - name: SMTP_ENABLED
              value: "true"
            - name: SMTP_HOST
              value: {{ .host | quote }}
            - name: SMTP_PORT
              value: {{ .port | quote }}
            - name: SMTP_FROM
              value: {{ .from | quote }}
            - name: SMTP_FROM_DISPLAY_NAME
              value: {{ .fromDisplayName | quote }}
            - name: SMTP_REPLY_TO
              value: {{ .replyTo | default .from | quote }}
            - name: SMTP_SSL
              value: {{ .ssl | quote }}
            - name: SMTP_STARTTLS
              value: {{ .starttls | quote }}
            - name: SMTP_AUTH
              value: {{ .auth | quote }}
            - name: SMTP_USER
              value: {{ .user | quote }}
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  {{- if $.Values.app.existingSecret }}
                  name: {{ $.Values.app.existingSecret }}
                  {{- else }}
                  name: {{ include "openprime-keycloak.fullname" $ }}-secrets
                  {{- end }}
                  key: {{ .passwordSecretKey }}
{{- else }}
            - name: SMTP_ENABLED
              value: "false"
{{- end }}
{{- end }}
          command:
            - /bin/bash
            - -ec
            - |
              KCADM=/opt/keycloak/bin/kcadm.sh

              # Wait for Keycloak the way config-cli does. This container starts
              # after the initContainer, but a chart bump rolls the Deployment at
              # the same time, so the Service can have no ready endpoint when we
              # arrive. Without this the step dies on "Connection refused" and
              # only survives because the Job restarts it — which is luck, not
              # design, and it burns a backoffLimit attempt every deploy.
              deadline=$(( $(date +%s) + ${KEYCLOAK_WAIT_SECONDS} ))
              until "$KCADM" config credentials --server "$KEYCLOAK_URL" \
                      --realm master --user "$KEYCLOAK_USER" \
                      --password "$KEYCLOAK_PASSWORD" 2>/dev/null; do
                if [ "$(date +%s)" -ge "$deadline" ]; then
                  echo "keycloak did not become reachable at ${KEYCLOAK_URL} within ${KEYCLOAK_WAIT_SECONDS}s" >&2
                  # One last attempt, unsilenced, so the real error reaches the log
                  # rather than a timeout message that hides it.
                  "$KCADM" config credentials --server "$KEYCLOAK_URL" \
                    --realm master --user "$KEYCLOAK_USER" --password "$KEYCLOAK_PASSWORD"
                  exit 1
                fi
                echo "keycloak not ready yet, retrying..."
                sleep 5
              done

              if [ "${SMTP_ENABLED}" != "true" ]; then
                echo "smtp disabled - password reset stays off"
              else
              # Not indented under the else on purpose: the JSON heredoc
              # terminators must start the line.
              smtp_json() {
                cat <<JSON
              {
                "host": "${SMTP_HOST}",
                "port": "${SMTP_PORT}",
                "from": "${SMTP_FROM}",
                "fromDisplayName": "${SMTP_FROM_DISPLAY_NAME}",
                "replyTo": "${SMTP_REPLY_TO}",
                "envelopeFrom": "${SMTP_FROM}",
                "ssl": "${SMTP_SSL}",
                "starttls": "${SMTP_STARTTLS}",
                "auth": "${SMTP_AUTH}",
                "user": "${SMTP_USER}",
                "password": "${SMTP_PASSWORD}"
              }
              JSON
              }

              # Prove mail can leave the cluster BEFORE anything advertises a
              # reset link. A non-2xx here fails the Job, which fails the sync —
              # so a deploy cannot leave production offering a reset that dies
              # at send time. This is the check that today's outage lacked.
              echo "testing SMTP against ${SMTP_HOST}:${SMTP_PORT} ..."
              smtp_json | "$KCADM" create "realms/${REALM}/testSMTPConnection" -f -
              echo "SMTP OK"

              # Only now switch on the flows that depend on working mail. The
              # realm import leaves both false, so the unsafe combination
              # (reset advertised, mail broken) is never a persisted state.
              "$KCADM" update "realms/${REALM}" -f - <<JSON
              {
                "resetPasswordAllowed": true,
                "verifyEmail": true,
                "smtpServer": $(smtp_json)
              }
              JSON
              echo "password reset enabled"
              fi

              # Google sign-in. kcadm -s escapes each value, so a secret
              # containing quotes cannot break the request the way a hand-built
              # JSON body would.
              IDP=identity-provider/instances/google
              if [ "${GOOGLE_ENABLED}" = "true" ]; then
                set -- -r "$REALM" \
                  -s alias=google -s providerId=google -s enabled=true \
                  -s trustEmail=true \
                  -s "config.clientId=${GOOGLE_CLIENT_ID}" \
                  -s "config.clientSecret=${GOOGLE_CLIENT_SECRET}" \
                  -s config.syncMode=IMPORT
                if "$KCADM" get "$IDP" -r "$REALM" > /dev/null 2>&1; then
                  "$KCADM" update "$IDP" "$@"
                else
                  "$KCADM" create identity-provider/instances "$@"
                fi
                echo "google sign-in enabled"
              elif "$KCADM" get "$IDP" -r "$REALM" > /dev/null 2>&1; then
                # Disable, never delete: deleting the provider drops every
                # user's link to their Google account.
                "$KCADM" update "$IDP" -r "$REALM" -s enabled=false
                echo "google sign-in disabled"
              fi
          resources:
            {{- toYaml .Values.realmSetup.resources | nindent 12 }}
      volumes:
        - name: realm-config
          configMap:
            name: {{ include "openprime-keycloak.fullname" . }}-realm-config
{{- end }}
