{{- if .Values.realmSetup.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "openprime-keycloak.fullname" . }}-realm-setup
  labels:
    {{- include "openprime-keycloak.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "1"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  template:
    metadata:
      annotations:
        {{- if .Values.app.existingSecret }}
        checksum/secrets: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum | default "dynamic" }}
        {{- end }}
      labels:
        {{- include "openprime-keycloak.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: realm-setup
    spec:
      restartPolicy: OnFailure
      containers:
        - name: keycloak-config-cli
          image: "{{ .Values.realmSetup.image.repository }}:{{ .Values.realmSetup.image.tag }}"
          imagePullPolicy: {{ .Values.realmSetup.image.pullPolicy }}
          env:
            - name: KEYCLOAK_URL
              value: "http://{{ include "openprime-keycloak.fullname" . }}:{{ .Values.service.port }}"
            
            {{- /* Admin Username Logic */ -}}
            {{- if .Values.app.existingSecret }}
            - name: KEYCLOAK_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.app.existingSecret }}
                  key: KC_BOOTSTRAP_ADMIN_USERNAME
            {{- else if and .Values.app.secrets .Values.app.secrets.KC_BOOTSTRAP_ADMIN_USERNAME }}
            - name: KEYCLOAK_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "openprime-keycloak.fullname" . }}-secrets
                  key: KC_BOOTSTRAP_ADMIN_USERNAME
            {{- else }}
            - name: KEYCLOAK_USER
              value: {{ .Values.app.env.KC_BOOTSTRAP_ADMIN_USERNAME | quote }}
            {{- end }}

            {{- /* Admin Password Logic */ -}}
            {{- if .Values.app.existingSecret }}
            - name: KEYCLOAK_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.app.existingSecret }}
                  key: KC_BOOTSTRAP_ADMIN_PASSWORD
            {{- else if and .Values.app.secrets .Values.app.secrets.KC_BOOTSTRAP_ADMIN_PASSWORD }}
            - name: KEYCLOAK_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "openprime-keycloak.fullname" . }}-secrets
                  key: KC_BOOTSTRAP_ADMIN_PASSWORD
            {{- else }}
            - name: KEYCLOAK_PASSWORD
              value: {{ .Values.app.env.KC_BOOTSTRAP_ADMIN_PASSWORD | quote }}
            {{- end }}

            - name: KEYCLOAK_AVAILABILITYCHECK_ENABLED
              value: "true"
            - name: KEYCLOAK_AVAILABILITYCHECK_TIMEOUT
              value: "120s"
            - name: IMPORT_PATH
              value: "/config"
            - name: IMPORT_FORCE
              value: "true"
            {{- if .Values.openprime.realm.smtp.enabled }}
            # Only enabled alongside SMTP, because the realm's SMTP password is
            # the one value that must not sit in a ConfigMap. Verified there are
            # no other $(...) patterns in the realm JSON for this to catch.
            - name: IMPORT_VAR_SUBSTITUTION_ENABLED
              value: "true"
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  {{- if .Values.app.existingSecret }}
                  name: {{ .Values.app.existingSecret }}
                  {{- else }}
                  name: {{ include "openprime-keycloak.fullname" . }}-secrets
                  {{- end }}
                  key: {{ .Values.openprime.realm.smtp.passwordSecretKey }}
            {{- else }}
            - name: IMPORT_VAR_SUBSTITUTION_ENABLED
              value: "false"
            {{- end }}
          volumeMounts:
            - name: realm-config
              mountPath: /config
              readOnly: true
          resources:
            {{- toYaml .Values.realmSetup.resources | nindent 12 }}
      volumes:
        - name: realm-config
          configMap:
            name: {{ include "openprime-keycloak.fullname" . }}-realm-config
{{- end }}
