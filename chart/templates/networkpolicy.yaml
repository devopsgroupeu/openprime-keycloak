{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "openprime-keycloak.fullname" . }}
  labels:
    {{- include "openprime-keycloak.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "openprime-keycloak.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    {{- if .Values.keycloak.cache.enabled }}
    # Clustering traffic between our own replicas. The configured rules below
    # describe who may reach Keycloak from outside; none of them cover Keycloak
    # talking to itself, so enabling a policy without this silently breaks the
    # Infinispan cluster and puts every pod back on a local cache.
    - from:
        - podSelector:
            matchLabels:
              {{- include "openprime-keycloak.selectorLabels" . | nindent 14 }}
    {{- end }}
    {{- if .Values.realmSetup.enabled }}
    # The realm-setup Job configures Keycloak through its Service.
    - from:
        - podSelector:
            matchLabels:
              {{- include "openprime-keycloak.realmSetupSelectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.targetPort }}
    {{- end }}
    {{- range .Values.networkPolicy.ingress }}
    - {{- toYaml . | nindent 6 }}
    {{- end }}
  egress:
    {{- if .Values.keycloak.cache.enabled }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "openprime-keycloak.selectorLabels" . | nindent 14 }}
    # DNS_PING resolves the headless Service, so egress to cluster DNS is part
    # of discovery, not incidental.
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- end }}
    {{- range .Values.networkPolicy.egress }}
    - {{- toYaml . | nindent 6 }}
    {{- end }}
{{- if .Values.realmSetup.enabled }}
---
# The realm-setup Job has labels of its own, so the policy above does not cover
# it. It holds the master admin credentials and only ever talks to Keycloak:
# that and DNS is all it may reach, and nothing may reach it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "openprime-keycloak.fullname" . }}-realm-setup
  labels:
    {{- include "openprime-keycloak.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "openprime-keycloak.realmSetupSelectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "openprime-keycloak.selectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.targetPort }}
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
{{- end }}
{{- end }}