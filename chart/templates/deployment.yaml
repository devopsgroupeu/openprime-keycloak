apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "openprime-keycloak.fullname" . }}
  labels:
    {{- include "openprime-keycloak.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "openprime-keycloak.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- if .Values.app.existingSecret }}
        checksum/secrets: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum | default "dynamic" }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "openprime-keycloak.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "openprime-keycloak.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if .Values.keycloak.command }}
          command:
            {{- toYaml .Values.keycloak.command | nindent 12 }}
          {{- end }}
{{- if and .Values.keycloak.devMode .Values.keycloak.optimized }}
{{- fail "keycloak.devMode and keycloak.optimized are mutually exclusive — start-dev has no build to optimize" }}
{{- end }}
{{- if and .Values.keycloak.devMode .Values.keycloak.cache.enabled }}
{{- fail "keycloak.devMode forces a local cache — clustering cannot work under start-dev" }}
{{- end }}
{{- if and .Values.keycloak.cache.enabled (lt (int .Values.replicaCount) 2) }}
{{- fail "keycloak.cache.enabled with replicaCount < 2 does nothing; and replicaCount >= 2 without it logs users out at random. Set both." }}
{{- end }}
{{- if and (ge (int .Values.replicaCount) 2) (not .Values.keycloak.cache.enabled) }}
{{- fail "replicaCount >= 2 without keycloak.cache.enabled: Keycloak defaults to a LOCAL cache, so a second replica loses sessions. Enable the cache first." }}
{{- end }}
{{- /* The HPA reaches >1 replica without replicaCount ever changing, so it needs
       the same guard — the chart shipped autoscaling on with minReplicas 2 and
       the cache off, which is exactly the combination that loses sessions. */}}
{{- if and .Values.autoscaling.enabled (ge (int .Values.autoscaling.minReplicas) 2) (not .Values.keycloak.cache.enabled) }}
{{- fail "autoscaling.minReplicas >= 2 without keycloak.cache.enabled: the HPA will run replicas that do not share sessions. Enable the cache first." }}
{{- end }}
          {{- if .Values.keycloak.args }}
          args:
            {{- toYaml .Values.keycloak.args | nindent 12 }}
          {{- else if .Values.keycloak.devMode }}
          args:
            - start-dev
            - --import-realm
          {{- else }}
          args:
            - start
            {{- if .Values.keycloak.optimized }}
            - --optimized
            {{- end }}
            - --import-realm
          {{- end }}
          env:
            {{- if .Values.keycloak.cache.enabled }}
            # Infinispan over JGroups. The 'kubernetes' stack discovers peers by
            # resolving the headless Service, so jgroups.dns.query must name it —
            # the normal Service would return one ClusterIP and the pods would
            # never find each other.
            - name: KC_CACHE
              value: "ispn"
            - name: KC_CACHE_STACK
              value: {{ .Values.keycloak.cache.stack | quote }}
            - name: JAVA_OPTS_APPEND
              value: "-Djgroups.dns.query={{ include "openprime-keycloak.fullname" . }}-headless.{{ .Release.Namespace }}.svc.cluster.local"
            {{- end }}
            {{- /* 1. Define used keys to avoid duplicates */ -}}
            {{- $usedKeys := dict -}}

            {{- /* 2. Secrets from existingSecret */ -}}
            {{- if .Values.app.existingSecret }}
            {{- range .Values.app.existingSecretKeys }}
            - name: {{ . }}
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.app.existingSecret }}
                  key: {{ . }}
            {{- $_ := set $usedKeys . true -}}
            {{- end }}
            {{- end }}

            {{- /* 3. Internal secrets if no existingSecret but app.secrets is provided */ -}}
            {{- if and (not .Values.app.existingSecret) .Values.app.secrets }}
            {{- range $key, $value := .Values.app.secrets }}
            - name: {{ $key }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "openprime-keycloak.fullname" $ }}-secrets
                  key: {{ $key }}
            {{- $_ := set $usedKeys $key true -}}
            {{- end }}
            {{- end }}

            {{- /* 4. Literal environment variables from app.env */ -}}
            {{- range $key, $value := .Values.app.env }}
            {{- if not (hasKey $usedKeys $key) }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- $_ := set $usedKeys $key true -}}
            {{- end }}
            {{- end }}
            
            {{- /* 5. Additional manual environment variables */ -}}
            {{- if .Values.keycloak.extraEnvVars }}
            {{- range .Values.keycloak.extraEnvVars }}
            {{- if not (hasKey $usedKeys .name) }}
            - name: {{ .name }}
              value: {{ .value | quote }}
            {{- $_ := set $usedKeys .name true -}}
            {{- end }}
            {{- end }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
            - name: management
              containerPort: 9000
              protocol: TCP
          {{- if .Values.healthCheck.enabled }}
          livenessProbe:
            {{- toYaml .Values.healthCheck.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.healthCheck.readinessProbe | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            {{- if .Values.keycloak.extraVolumeMounts }}
            {{- toYaml .Values.keycloak.extraVolumeMounts | nindent 12 }}
            {{- end }}
      volumes:
        {{- if .Values.keycloak.extraVolumes }}
        {{- toYaml .Values.keycloak.extraVolumes | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
