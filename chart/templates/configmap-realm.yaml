apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "openprime-keycloak.fullname" . }}-realm-config
  labels:
    {{- include "openprime-keycloak.labels" . | nindent 4 }}
data:
  openprime-realm.json: |
    {
      "realm": "openprime",
      "enabled": true,
      "registrationAllowed": {{ .Values.openprime.realm.registrationAllowed }},
      "resetPasswordAllowed": {{ .Values.openprime.realm.resetPasswordAllowed }},
      "rememberMe": true,
      "displayName": "OpenPrime",
      "sslRequired": "{{ .Values.openprime.realm.sslRequired }}",
      "bruteForceProtected": {{ .Values.openprime.realm.bruteForceProtected }},
      "accessTokenLifespan": {{ .Values.openprime.realm.accessTokenLifespan }},
      "refreshTokenMaxReuse": 0,
      "ssoSessionIdleTimeout": {{ .Values.openprime.realm.ssoSessionIdleTimeout }},
      "ssoSessionMaxLifespan": {{ .Values.openprime.realm.ssoSessionMaxLifespan }},
      "loginTheme": "openprime",
      "accountTheme": "openprime",
      "clients": [
        {
          "clientId": "openprime-app",
          "enabled": true,
          "publicClient": true,
          "standardFlowEnabled": true,
          "implicitFlowEnabled": false,
          "directAccessGrantsEnabled": false,
          "redirectUris": {{ concat (list (printf "https://%s/*" .Values.openprime.frontendUrl)) (.Values.openprime.realm.extraRedirectUris | default (list)) | toJson }},
          "webOrigins": {{ concat (list (printf "https://%s" .Values.openprime.frontendUrl)) (.Values.openprime.realm.extraWebOrigins | default (list)) | toJson }},
          "attributes": {
            "pkce.code.challenge.method": "S256"
          },
          "protocol": "openid-connect"
        }
      ],
      "users": []
    }
