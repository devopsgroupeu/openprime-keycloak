{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "openprime-keycloak.serviceAccountName" . }}
  labels:
    {{- include "openprime-keycloak.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
{{- end }}
{{- if .Values.realmSetup.enabled }}
---
# The realm-setup Job talks to Keycloak over HTTP, never to the Kubernetes API,
# so it gets an identity of its own and no token.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "openprime-keycloak.fullname" . }}-realm-setup
  labels:
    {{- include "openprime-keycloak.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- end }}