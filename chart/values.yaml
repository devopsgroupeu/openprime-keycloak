# Default values for openprime-keycloak.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

# Pod Disruption Budget - disabled by default. Keycloak runs as a single replica
# here, so enable this only as maxUnavailable: 0 to protect the identity pod from
# voluntary eviction (node drains then require manual maintenance), or move to a
# clustered HA deployment (>=2 replicas + Infinispan) before using minAvailable.
podDisruptionBudget:
  enabled: false
  minAvailable: 1

image:
  # Use custom image with OpenPrime theme baked in
  # To build: docker build -t your-registry/openprime-keycloak:26.2.0 openprime-keycloak/
  repository: ghcr.io/devopsgroupeu/openprime-keycloak
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: latest
  # For custom image with theme:
  # repository: your-registry/openprime-keycloak
  # tag: "26.2.0"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""
  automount: true

podAnnotations: {}
podLabels: {}

podSecurityContext:
  fsGroup: 1000
  runAsNonRoot: true
  runAsUser: 1000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 1000

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
    # cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: keycloak.openprime.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: keycloak-tls
  #    hosts:
  #      - keycloak.openprime.local

resources:
  limits:
    cpu: 1000m
    memory: 2Gi
  requests:
    cpu: 500m
    memory: 1Gi

autoscaling:
  # Off by default, deliberately. Scaling an identity service past one replica
  # without session replication logs users out at random, so this may only be
  # enabled together with keycloak.cache.enabled — the chart refuses to render
  # otherwise.
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - openprime-keycloak
          topologyKey: kubernetes.io/hostname

# Keycloak specific configuration
keycloak:
  # Dev mode: 'kc.sh start-dev'. Relaxes hostname checks, allows HTTP, and forces
  # a LOCAL cache with no clustering — never correct for production.
  #
  # This is an explicit flag rather than something you reach by overriding `args`
  # below. Production ran start-dev for months precisely because a raw args
  # override silently negated `production: true` sitting three lines above it.
  devMode: false
  # Adds --optimized, which skips the build step at startup. The Dockerfile in
  # this repo runs `kc.sh build`, so it is valid for the image built here —
  # measured at ~15s of boot instead of ~30s, on the critical path of every
  # rolling restart.
  #
  # Default stays false because the chart also serves images that were not built
  # that way, and Keycloak refuses to start with --optimized on an unbuilt image.
  # Both failure modes are loud at boot, never a silently misconfigured server:
  #   unbuilt image  -> "The '--optimized' flag was used for first ever start"
  #   values drift   -> "build time options have values that differ from what is
  #                      persisted", naming the options
  # If you set this true, the image's baked build options (KC_DB,
  # KC_HEALTH_ENABLED, KC_HTTP_RELATIVE_PATH) must match what you set here.
  optimized: false
  # Distributed cache. Required before running more than one replica: Keycloak
  # defaults to a LOCAL cache, so a second replica behind the ALB means users
  # randomly hit a pod that does not know their session and get logged out
  # mid-flow. Worse than the single replica, not better.
  cache:
    enabled: false
    # 'kubernetes' resolves peers through the headless Service via JGroups
    # DNS_PING, which is why that Service exists.
    stack: kubernetes
  # Custom command (optional)
  command: []
  # ESCAPE HATCH — when set, this replaces the args computed from devMode and
  # optimized entirely, including any safety they provide. Prefer the flags.
  args: []
  # Extra environment variables
  extraEnvVars:
    - name: KC_PROXY_HEADERS
      value: "xforwarded"
    - name: KC_HEALTH_ENABLED
      value: "true"
  # Extra volume mounts
  extraVolumeMounts: []
  # Extra volumes
  extraVolumes: []
# Application specific configuration
app:
  # Keycloak environment variables
  env:
    # Admin user configuration
    KC_BOOTSTRAP_ADMIN_USERNAME: "admin@devopsgroup.sk"
    # Option 2: hardcoded secrets as plain env vars (used when existingSecret is not set)
    KC_BOOTSTRAP_ADMIN_PASSWORD: ""
    KC_DB_PASSWORD: ""

    # Database configuration
    KC_DB: "postgres"
    KC_DB_URL_HOST: "openprime-postgres"
    KC_DB_URL_DATABASE: "keycloak"
    KC_DB_USERNAME: "keycloak_user"

    # Hostname configuration
    KC_HOSTNAME: keycloak.openprime.local
    KC_HTTP_ENABLED: "true"
    KC_HOSTNAME_STRICT: "false"
    KC_HTTP_RELATIVE_PATH: "/"

  # Option 1: use a pre-existing k8s Secret for sensitive values.
  # When set, existingSecretKeys are injected from this secret instead of app.env.
  existingSecret: ""
  # Keys to load from the existing secret (only used when existingSecret is set)
  existingSecretKeys:
    - KC_DB_PASSWORD
    - KC_BOOTSTRAP_ADMIN_PASSWORD
    - KC_BOOTSTRAP_ADMIN_USERNAME
    - KEYCLOAK_ADMIN
    - KEYCLOAK_ADMIN_PASSWORD

  # Option 2: Hardcoded secrets (only used if existingSecret is empty)
  # secrets:
  #   KC_BOOTSTRAP_ADMIN_PASSWORD: "difficult-password"
  #   KC_BOOTSTRAP_ADMIN_USERNAME: "admin@devopsgroup.sk"
  secrets: {}

openprime:
  frontendUrl: app.openprime.local
  domain: openprime.io
  # Realm security settings. Defaults are production-hardened; local/demo
  # environments relax them via their own values (see local-testing dev values).
  realm:
    # Require HTTPS for external requests (allows HTTP only on the private network).
    sslRequired: external
    # Open self-registration is a deliberate product choice; keep it enabled.
    # Recommended follow-up once SMTP exists: set verifyEmail to require confirmation.
    registrationAllowed: true
    bruteForceProtected: true
    # Extra redirect URIs / web origins appended to the secure https://<frontendUrl>
    # base. Prod leaves these empty; dev/demo adds its http and localhost variants.
    extraRedirectUris: []
    extraWebOrigins: []
    # Session timeouts. accessTokenLifespan MUST stay well below
    # ssoSessionIdleTimeout: the frontend only refreshes when the access token is
    # nearly expired, so a token that outlives the idle window means the session
    # has already gone idle by the time the first refresh is attempted — a forced
    # logout on a fixed schedule, for every user, regardless of activity. These
    # shipped as 3600 > 1800, which logged everyone out at ~60 minutes.
    accessTokenLifespan: 300
    ssoSessionIdleTimeout: 3600
    ssoSessionMaxLifespan: 36000
    # Password reset and email verification are DERIVED from smtp.enabled below,
    # not configured separately. Keycloak will happily show a "Forgot password"
    # link with no mail server behind it — that is exactly the dead end this
    # replaced, and a separate flag would let it come back the first time
    # someone enables one without the other.
    smtp:
      # Off by default: a chart with no mail server must not advertise reset.
      enabled: false
      host: ""
      port: 587
      # STARTTLS on 587 is the usual pairing; set ssl instead for implicit TLS
      # on 465. Both true is not a valid combination.
      starttls: true
      ssl: false
      auth: true
      user: ""
      # The password is never a value. It comes from the secret named in
      # app.existingSecret under the key below, and is substituted into the
      # realm at import time.
      passwordSecretKey: SMTP_PASSWORD
      from: ""
      fromDisplayName: OpenPrime
      replyTo: ""

healthCheck:
  enabled: true
  # Both probes used to be `bash -c '</dev/tcp/localhost/8080'` — a bare TCP
  # connect. That passes for any pod with a socket open, including one answering
  # 500 to every request, which is precisely the failure it needs to catch.
  #
  # Measured against a real Keycloak with its database stopped:
  #
  #   /health/live   200 UP     <- unchanged
  #   /health/ready  200 UP     <- unchanged, despite being "ready"
  #   TCP :8080      open       <- unchanged
  #   /realms/master 500        <- the only signal that moved
  #
  # Keycloak 26 ships no database check in /health (its `checks` array is empty),
  # so swapping TCP for /health/ready would have changed nothing. Readiness
  # therefore probes a real endpoint that touches the database.
  livenessProbe:
    httpGet:
      path: /health/live
      port: management
    initialDelaySeconds: 120
    periodSeconds: 30
    timeoutSeconds: 15
    failureThreshold: 15

  # Deliberately deeper than liveness. A pod that cannot reach the database is
  # removed from the Service rather than left serving 500s.
  #
  # The trade-off, stated: a total database outage takes every replica out at
  # once, so callers get a connection failure instead of a 500. That is the
  # right outcome — Keycloak without its database serves nothing useful — and
  # the case this actually buys is the single sick replica, which today would
  # keep taking traffic.
  #
  # `master` rather than the openprime realm on purpose: it always exists, so a
  # failed realm import cannot leave every pod permanently NotReady.
  readinessProbe:
    httpGet:
      path: /realms/master
      port: http
    initialDelaySeconds: 40
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

# Network policies
networkPolicy:
  enabled: false
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: openprime-app
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: openprime-app-backend
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: openprime-postgres

# Realm configuration setup using keycloak-config-cli
realmSetup:
  enabled: true
  # Budget for the smtp-setup step to wait for Keycloak. Longer than the
  # config-cli availability check because a chart bump rolls the Deployment
  # while this Job is already running.
  keycloakWaitSeconds: 180
  image:
    repository: adorsys/keycloak-config-cli
    tag: "6.4.0-26"
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
