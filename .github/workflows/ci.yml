name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Helm Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: "v3.12.0"

      - name: Lint chart
        run: helm lint chart -f chart/ci/test-values.yaml

      - name: Template chart (CI values must render)
        run: helm template ci chart -f chart/ci/test-values.yaml > /dev/null

      # The chart must refuse to render without its passwords (OP-270).
      - name: Template chart (default values must refuse to render)
        run: |
          if helm template ci chart > /dev/null 2> err.txt; then
            echo "::error::rendered without KC_DB_PASSWORD and KC_BOOTSTRAP_ADMIN_PASSWORD"
            exit 1
          fi
          grep -q "KC_DB_PASSWORD is required" err.txt

      - name: Validate rendered realm JSON parses
        run: |
          helm template ci chart -f chart/ci/test-values.yaml --show-only templates/configmap-realm.yaml \
            | sed -n '/openprime-realm.json:/,$p' | sed '1d;s/^    //' \
            | python3 -c "import json,sys; json.load(sys.stdin); print('realm JSON valid')"

  validate-pr-title:
    name: Validate PR Title
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: read
    steps:
      - name: Validate PR title
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
